text: data/jsonl/P66_en.jsonl
dictionary: dictionary/en_annot_P66.jsonl
lang: en
profile: term_recall
out: outputs/annotation_P66_en.md
report: outputs/report_P66_en.md

profile_overrides:
  use_lemma: true
  allow_single_token_fallback: true
  batch_size: 64

quality:
  enabled: true
  strict_stopwords: true
  require_pos_match: false
  penalize_single_token: true
  single_token_penalty: 0.14
  multi_token_bonus: 0.03
  case_sensitive_entities: true
  context_guard: true
  contextual_scoring: true
  context_window: 2
  discourse_pattern_guard: true
  function_context_penalty: 0.16
  lexical_context_bonus: 0.05
  exact_pos_bonus: 0.04
